services:
  dorka-server:
    image: dorka-server:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DORKA_COMPUTER_IMAGE: "${DORKA_COMPUTER_IMAGE:-dorka-computer:selkies}"
    ports:
      - "${DORKA_SERVER_PORT:-6768}:6768"
    volumes:
      - dorka-data:/data
      - "${DORKA_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6768'"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      - dorka-control
      - dorka-runtimes

volumes:
  dorka-data:
    name: dorka-data

networks:
  dorka-control:
    name: dorka-control
  dorka-runtimes:
    name: dorka-runtimes
    internal: true
